name: Fetch daily fuel price

on:
  schedule:
    # 10:00 AM GMT+7 = 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openpyxl

      - run: python scripts/fetch-price.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "data: update fuel prices for $(date -u +%Y-%m-%d)"
          git push
